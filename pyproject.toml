[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canon-edsdk-film-scanner"
version = "0.1.0"
description = "Wired, low-latency remote-control film scanning for Canon cameras over EDSDK/USB, with live positive preview."
readme = "README.md"
# Upper bound is opencv-python wheel availability, not a language requirement.
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Rafat Hossain" }]
keywords = ["film", "scanning", "negative", "canon", "edsdk", "tethering", "photography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture",
]

# Kept in sync with requirements.txt. requirements.txt is what a newcomer runs;
# this is what pip needs to install the package itself.
dependencies = [
    "PyYAML>=6.0,<7",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "rawpy>=0.22,<1",
    "pillow-heif>=0.16,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet, readable output by default; add -v when you are debugging one test.
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:cefs.*",
    # Starlette's TestClient warns that it wants httpx2. Not our call to make,
    # and not worth adding a dependency over.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
