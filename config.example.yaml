# Canon EDSDK Film Scanner -- example configuration
#
# Copy this file to `config.yaml` and edit it:
#
#     copy config.example.yaml config.yaml      (Windows)
#     cp config.example.yaml config.yaml        (macOS/Linux)
#
# `config.yaml` is git-ignored because it contains a path into your own copy
# of Canon's EDSDK. Never commit it.
#
# Every value below can also be overridden by an environment variable named
# CEFS_<SECTION>_<KEY>, uppercased -- e.g. CEFS_EDSDK_LIBRARY_DIR. Environment
# variables win over the file. Useful for CI and for temporary experiments.

edsdk:
  # Directory containing the 64-bit EDSDK shared library you downloaded from
  # Canon's Developer Community. This repository does not and cannot ship it.
  #
  # Use the 64-bit library with 64-bit Python. Mixing bitness fails at load
  # time with an error that does not mention bitness at all, so check this
  # first if loading fails.
  #
  # Keep the SDK outside the repository, or in ./edsdk_sdk/ which is ignored.
  #
  # Windows:  the folder holding EDSDK.dll, e.g. "C:/EDSDK/Dll"
  # macOS:    the folder holding EDSDK.framework, e.g. "edsdk_sdk/Framework"
  #           Canon ships that framework with a broken code signature and it
  #           will not load until you re-sign it -- see "With a real camera"
  #           in the README. A relative path resolves against the repo root,
  #           or against the app's own folder when running the packaged build.
  library_dir: "C:/EDSDK/Dll"

  # Optional: full path to the library file, if it is not the expected default
  # name inside library_dir. Leave empty to let the loader find it.
  library_path: ""

liveview:
  # Frames per second the pump targets. This caps how hard we poll; the real
  # ceiling is whatever the body delivers.
  #
  # That ceiling is not a fixed number. With exposure simulation the camera
  # emits live view at roughly the **taking shutter speed**, so a slow shutter
  # throttles the preview long before USB or the host does -- measured on an
  # R7, 1/15 gave exactly 15 fps (66.8 ms between frames), while a fast
  # shutter gave 96.5 fps of genuinely distinct frames. If focusing feels
  # choppy, check the shutter speed first.
  #
  # 30 is a safe default. Raising it is worthwhile once the shutter is fast:
  # measured end to end on macOS, 30 -> 27 fps, 60 -> 48, 120 -> 71.7. Past
  # that the host is the limit, not the camera -- the inversion pipeline costs
  # 13.2 ms a frame in colour and 19.0 ms in B&W, so B&W cannot exceed ~52 fps
  # however high this goes.
  target_fps: 30

capture:
  # Seconds to wait after the *last* command that could have disturbed the rig
  # before actually firing the shutter. On a copy stand, residual vibration is
  # the main cause of soft scans; this is the cheapest fix available.
  settle_delay_s: 1.5

  # Prefer the electronic (silent) shutter, which eliminates mechanical shutter
  # shock. If the connected body does not expose the setting, the app warns and
  # continues rather than refusing to work.
  prefer_electronic_shutter: true

  # Where downloaded captures are written. A relative path resolves against
  # the repository root from a checkout, and against
  # Documents/Canon EDSDK Film Scanner from the packaged app -- which is also
  # where that build keeps this file. Git-ignored either way.
  output_dir: "captures"

  # Delete the file from the camera's card after a verified download.
  # Default is false: keeping the original on the card is the safer choice.
  delete_from_camera_after_download: false

  # After downloading, write an inverted positive beside each capture using the
  # same settings the live preview is showing. The original is never modified
  # or overwritten. All four of these can also be changed from the UI, for the
  # session; only this file makes a change permanent.
  develop_positives: true

  # Container for the positive:
  #   auto  keep the depth the capture had -- 16-bit TIFF from RAW and from
  #         HEIF (which an EOS body writes as 10-bit PQ), JPEG from JPEG
  #   tiff  always TIFF
  #   jpeg  always JPEG, which means 8 bits even from a RAW
  positive_format: "auto"

  # TIFF compression: none, lzw or deflate. All three are lossless. Measured on
  # two real 32 MP positives: none 194 MB in 0.15 s, lzw 162-178 MB (1.1-1.2x)
  # in 2.3 s, deflate 74-81 MB (2.4-2.6x) in about 5 s.
  #
  # Deflate by default. LZW barely compresses 16-bit continuous tone, and it is
  # what OpenCV writes anyway when given no setting, so it is not a choice so
  # much as the absence of one.
  tiff_compression: "deflate"

  # Quality of a JPEG positive, 1-100. Does not affect TIFF output.
  jpeg_quality: 95

roll:
  # How captures are named. A camera calls everything IMG_0001 and rolls the
  # counter at 9999, which says nothing about which roll a scan belongs to.
  #
  # Fields: {roll} {frame} {original} {date} {time} {stock}
  #   {frame:02d} pads the number, and a / makes a folder. At least one of
  #   {frame}, {original} or {time} must appear, or every frame of the roll
  #   renders to the same name.
  #
  # The roll name is repeated in the filename on purpose: scans get imported
  # and dragged around, and Roll014_Frame07.CR3 survives being separated from
  # its folder where Frame07.CR3 does not.
  #
  # Leave empty to keep the camera's own filenames.
  template: "{roll}/{roll}_Frame{frame:02d}"

  # Starting values only -- the UI changes these constantly while scanning and
  # does not write them back here.
  roll: "Roll001"
  frame: 1              # next frame; one per shutter release, not per file

  # Recorded in roll.json beside the frames. Free text; the date accepts
  # "summer 2019" as readily as an ISO date, because for a found roll that is
  # the honest answer.
  stock: ""
  developer: ""
  notes: ""
  date: ""

  # Write roll.json at all.
  sidecar: true

film:
  # Which inversion pipeline the preview uses by default: "bw" or "color".
  # Both are first-class. This is only the startup default; the UI can switch.
  mode: "bw"

server:
  # The local web UI. Bound to loopback by default -- do not expose this to a
  # network you do not trust; it can fire your shutter.
  host: "127.0.0.1"
  port: 8000

camera:
  # Use the camera-free mock backend instead of EDSDK. Lets you develop the
  # processing and UI layers with no SDK and no camera attached.
  use_mock: true
